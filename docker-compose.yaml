version: '3.8'

services:
  minio:
    image: minio/minio:latest
    container_name: automq-minio
    command: server /data --console-address ":9001"
    ports:
      - "9000:9000"
      - "9001:9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadminpassword

  create-bucket:
    image: minio/mc:latest
    container_name: automq-minio-setup
    depends_on:
      - minio
    entrypoint: >
      /bin/sh -c "
      sleep 5; 
      mc alias set myminio http://minio:9000 minioadmin minioadminpassword;
      mc mb myminio/automq-data || true;
      mc mb myminio/automq-ops || true;
      echo 'MinIO S3 Buckets Ready';
      "

  automq:
    image: automqinc/automq:latest
    container_name: automq-broker
    depends_on:
      create-bucket:
        condition: service_completed_successfully
    ports:
      - "9092:9092"
    command:
      - bash
      - -c
      - |
        /opt/automq/kafka/bin/kafka-server-start.sh \
        /opt/automq/kafka/config/kraft/server.properties \
        --override cluster.id=3D4fXN-yS1-vsQ8aJ_q4Mg \
        --override node.id=0 \
        --override process.roles=broker,controller \
        --override controller.quorum.voters=0@localhost:9093 \
        --override listeners=PLAINTEXT://0.0.0.0:9092,CONTROLLER://0.0.0.0:9093 \
        --override advertised.listeners=PLAINTEXT://localhost:9092 \
        --override controller.listener.names=CONTROLLER \
        --override listener.security.protocol.map=PLAINTEXT:PLAINTEXT,CONTROLLER:PLAINTEXT \
        --override auto.create.topics.enable=true \
        --override s3.data.buckets='0@s3://automq-data?region=us-east-1&endpoint=http://minio:9000&pathStyle=true&accessKey=minioadmin&secretKey=minioadminpassword' \
        --override s3.ops.buckets='0@s3://automq-ops?region=us-east-1&endpoint=http://minio:9000&pathStyle=true&accessKey=minioadmin&secretKey=minioadminpassword' \
        --override s3.wal.path='0@s3://automq-data?region=us-east-1&endpoint=http://minio:9000&pathStyle=true&accessKey=minioadmin&secretKey=minioadminpassword'